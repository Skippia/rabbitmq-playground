services:
  publisher:
    build:
      context: ..
      dockerfile: ./publisher/Dockerfile
    restart: on-failure:5
    # depends_on:
    #   rabbitmq:
    #     condition: service_healthy
    # links: 
    #   - rabbitmq
    volumes:
      - ./index.ts:/usr/src/app/index.ts
      - ../node_modules:/usr/src/app/node_modules
    environment:
      USERNAME: "rmuser"
      PASSWORD: "rmpassword"
      HOSTNAME: "rabbitmq"
      PORT: "5672"
      QUEUE: "inbox"
      EXCHANGE: "inbox"
      ROUTINGKEY: "gen"
      COUNT: "100000"
      SLEEP: "1000"
    networks:
      - rabbitmq-share-net

networks:
  rabbitmq-share-net:
    external: true
